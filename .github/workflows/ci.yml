name: CI

# 本仓库此前没有 CI，验证全靠「本机构建 / 单测 / 真机」。这里把**能在无设备环境跑的部分**
# 固定下来。注意边界：**CI 绿 ≠ 能用** —— 无障碍执行层、内嵌 Node 的启动、dsh 运行时装配
# 都只能在真机上验证（见 AGENTS.md「真机」）。CI 只保证编译、单测、静态检查这三关。
# 纯文档改动不走重活，但 workflow 本身仍要运行：master 的 ruleset 把 changes 与下面三个 job
# 设为 required check，workflow 级 paths-ignore 会让这些 check 永远「等待上报」。
# 所以由 changes job 判范围，重活 job 用 if 跳过 —— skipped 的 required check 算通过。
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

# 同一分支连推时取消上一次：既省 runner，也让「最新一次是否绿」没有歧义
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 变更范围（代码 / 文档）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - id: filter
        name: 判断是否只有文档
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node tools/ci/changes-scope.mjs

  quality:
    name: 静态检查（ktlint / detekt / Android Lint）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # 上传 SARIF 到 Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-gates
        with:
          # Fork PR 没有 secret 时传空值，Gradle 正常构建，只不跨 runner 保存配置缓存。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: 门禁
        working-directory: android
        run: ./gradlew spotlessCheck detekt :app:lintDebug --console=plain
      - name: Android Lint 结果进 Security 标签页
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: android/app/build/reports/lint-results-debug.sarif
          category: android-lint
      - name: detekt 结果进 Security 标签页
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: android/build/reports/detekt/detekt.sarif
          category: detekt
      - name: 报告存档（失败时最需要它）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-reports
          retention-days: 14
          path: |
            android/build/reports/detekt/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.txt

  test:
    name: 单元测试（JVM）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-gates
        with:
          # 可选：fork PR 没有 secret 时为空，setup-gradle 自动跳过配置缓存加密。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # 顺带编译 androidTest：Lint 默认**不看**测试源码（checkTestSources 关着），
      # 不编一遍的话那两个真机测试文件在 CI 里等于没人管。
      - name: 单测 + androidTest 编译
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --console=plain
      - name: 测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-results
          retention-days: 14
          path: android/app/build/reports/tests/testDebugUnitTest/

  offline-checks:
    name: 离线自检（不需要设备）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/offline-checks/package-lock.json
      - name: 离线自检（审计 / profile / 插件边界）
        run: bash tools/offline-checks.sh
